# =====================================================
# 出入境旅游弱信号发现与研判 Agent — 配置文件
# =====================================================

llm:
  base_url: ""            # 留空则读取 .env 的 LLM_BASE_URL
  api_key: ""             # 留空则读取 .env 的 LLM_API_KEY
  model: ""               # 留空则读取 .env 的 LLM_MODEL
  temperature: 0.2
  max_tokens: 2048
  timeout: 120
  batch_size: 8           # 过滤/打标签时的批量判断条数
  max_content_chars: 500  # 送入 LLM 的单条内容截断长度

sources:
  google_news:
    enabled: true
    max_results: 25       # 每个关键词取前 N 条
    lookback_days: 3      # 只取最近 N 天的内容（自动追加 after: 时间窗口）
    queries:
      # 中文组：覆盖入境游 / 出境游 / 政策 / 体验
      - { lang: "zh-CN", q: "入境旅游 免签" }
      - { lang: "zh-CN", q: "外国游客 中国 旅游" }
      - { lang: "zh-CN", q: "中国游客 出境旅游" }
      - { lang: "zh-CN", q: "144小时过境免签" }
      # 英文组：覆盖海外视角
      - { lang: "en-US", q: "China visa-free tourism" }
      - { lang: "en-US", q: "inbound tourism China" }
      - { lang: "en-US", q: "Chinese tourists overseas" }
      - { lang: "en-US", q: "travel experience China" }
    # 社交媒体定向搜索（site: 语法，免费）：抓取社交平台被 Google News 索引的内容
    # Reddit 不被 Google News 索引，走 reddit 源的官方 API
    social_queries:
      - { lang: "en-US", q: "site:quora.com China travel visa" }
      - { lang: "en-US", q: "site:quora.com traveling China experience" }
      - { lang: "en-US", q: "site:x.com China visa-free travel" }
      - { lang: "en-US", q: "site:facebook.com China visa-free travel" }
      - { lang: "en-US", q: "site:youtube.com China travel experience" }
      - { lang: "zh-CN", q: "site:weibo.com 外国游客 中国" }
      - { lang: "zh-CN", q: "site:weibo.com 免签 入境" }
      - { lang: "zh-CN", q: "site:xiaohongshu.com 入境旅游" }

  reddit:
    enabled: true
    # 官方 API 密钥（可选，免费档）：在 .env 配置 REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET
    # 未配置时使用匿名模式，可能被 403 限流
    client_id: ""
    client_secret: ""
    subreddits: ["travel", "ChinaTravel", "China", "solotravel"]
    queries: ["China visa-free", "China tourism", "Chinese tourist", "China travel experience"]
    limit: 15             # 每个子版块×关键词取前 N 条
    sort: new             # new / relevance

  domestic:
    enabled: false        # 国内平台无公开稳定 API，默认关闭
    # 说明：此处可配置公开 RSS 源（如人民网、新华网旅游频道等），
    # 配置后自动接入通用 RSS 采集。今日头条/微博/小红书需单独评估合规代理方案。
    feeds: []

scoring:
  weights:
    novelty: 0.25         # 新颖性
    repetition: 0.20      # 重复性
    diffusion: 0.15       # 扩散性
    impact: 0.25          # 影响性
    sustainability: 0.15  # 持续性
  thresholds:
    normal: 3             # ≤3 普通信息（不进入日报）
    observe: 6            # 4-6 观察信息
    focus: 7              # ≥7 重点关注
  max_groups: 20          # 弱信号分组评分数量上限

output:
  data_dir: outputs/data
  report_dir: outputs/reports
  log_dir: outputs/logs
  keep_days: 30           # 原始数据保留天数
  timezone: Asia/Shanghai
