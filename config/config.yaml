# =====================================================
# 旅游服务质量苗头问题研判 Agent — 配置文件
#
# 客户：文旅部研究部门（已有舆情团队报热点，本系统只报热点之外的苗头问题）
# 聚焦：出入境旅游服务质量问题（不文明行为 / 服务弱项 / 文化冲突 / 误解）
# =====================================================

llm:
  base_url: ""            # 留空则读取 .env 的 LLM_BASE_URL
  api_key: ""             # 留空则读取 .env 的 LLM_API_KEY
  model: ""               # 留空则读取 .env 的 LLM_MODEL
  temperature: 0.2
  max_tokens: 2048
  timeout: 120
  batch_size: 8           # 过滤/打标签时的批量判断条数
  max_content_chars: 500  # 送入 LLM 的单条内容截断长度

sources:
  google_news:
    enabled: true
    max_results: 25       # 每个关键词取前 N 条
    lookback_days: 2      # 只取最近 N 天的内容（自动追加 after: 时间窗口）；discovery 兜底精确到东八区昨天 00:00
    queries:
      # 中文组：入境游服务质量 / 负面体验 / 不文明行为
      - { lang: "zh-CN", q: "外国游客 不文明行为" }
      - { lang: "zh-CN", q: "中国游客 不文明行为 海外" }
      - { lang: "zh-CN", q: "入境游客 投诉" }
      - { lang: "zh-CN", q: "旅游 服务质量 问题" }
      - { lang: "zh-CN", q: "外国游客 中国 体验" }
      - { lang: "zh-CN", q: "景区 宰客 投诉" }
      # 英文组：境外游客体验反馈（含隐性不满/文化差异）
      - { lang: "en-US", q: "China travel experience problems" }
      - { lang: "en-US", q: "China tourism service quality" }
      - { lang: "en-US", q: "China culture shock tourists" }
      - { lang: "en-US", q: "China travel visa problems" }
    # 社交媒体定向搜索（site: 语法，免费）——客户点名平台：X / YouTube / Facebook / Instagram
    social_queries:
      - { lang: "en-US", q: "site:x.com China travel experience" }
      - { lang: "en-US", q: "site:x.com China tourism service" }
      - { lang: "en-US", q: "site:x.com China culture shock" }
      - { lang: "en-US", q: "site:youtube.com China travel experience" }
      - { lang: "en-US", q: "site:youtube.com China tourism problems" }
      - { lang: "en-US", q: "site:facebook.com China travel experience" }
      - { lang: "en-US", q: "site:instagram.com China travel" }
      - { lang: "zh-CN", q: "site:xiaohongshu.com 入境 体验" }
      - { lang: "zh-CN", q: "site:xiaohongshu.com 外国游客 服务" }

  reddit:
    enabled: true          # 启用：官方 OAuth（.env 配置 REDDIT_CLIENT_ID/SECRET，免费）
    client_id: ""           # 留空则从 .env 读取
    client_secret: ""       # 留空则从 .env 读取
    subreddits: ["ChinaTravel", "travel", "China", "solotravel", "VisitingChina"]
    queries: [
      "China travel experience",
      "China hotel OR train OR payment problem",
      "China visa-free experience",
      "China tourist scam OR overcharge",
      "China trip review",
    ]
    limit: 25
    sort: new

  # YouTube 官方 API：游客 Vlog + 评论（一手体验反馈）。
  # 需 .env 配置 YOUTUBE_API_KEYS（多个 key 逗号分隔，自动轮换规避日配额）。
  youtube:
    enabled: true
    max_results: 10         # 每个查询取前 N 个视频（search 100单位/次，注意配额）
    lookback_days: 7        # 只取最近 N 天发布的视频
    fetch_comments: true    # 是否抓视频评论（评论=一手游客反馈，1单位/次，便宜）
    max_comments: 20        # 每个视频最多抓多少条热门评论
    comment_min_likes: 0    # 评论最少点赞数（过滤无意义评论）
    queries:
      - { lang: "en-US", q: "China travel experience" }
      - { lang: "en-US", q: "China travel problems" }
      - { lang: "en-US", q: "visiting China tips" }
      - { lang: "en-US", q: "China trip honest review" }
      - { lang: "en-US", q: "China culture shock" }

  # SerpApi（真实 Google 搜索）：搜 X/Instagram/Facebook 等社媒。
  # 需 .env 配置 SERPAPI_API_KEY；按次计费，daily_budget 限制每天搜索次数防超支。
  serpapi:
    enabled: true
    engine: google            # google 引擎对 site:x.com / instagram 社媒检索效果更好
    daily_budget: 6           # 每天最多 6 次搜索（防超额）
    max_results: 15
    queries:
      # X / Twitter 游客一手反馈（google 引擎 + site: 语法）
      - { lang: "en-US", q: "site:x.com China travel experience" }
      - { lang: "en-US", q: "site:x.com China travel scam OR overcharge OR complaint" }
      # Instagram 游客体验
      - { lang: "en-US", q: "site:instagram.com China travel experience" }
      # Facebook 游客反馈
      - { lang: "en-US", q: "site:facebook.com China travel experience" }
      # 中国出入境服务质量（网页/新闻，google 引擎）
      - { lang: "en-US", q: "China travel tourist scam OR overcharge complaint" }
      - { lang: "zh-CN", q: "外国游客 中国 旅游 体验 问题" }

  hotsearch:
    enabled: true          # 国内平台热搜（百度/微博/头条/抖音等聚合榜）
    boards:
      # 优先文旅/社会/民生/国际类榜单，每个取前 N 条再按关键词预筛
      - { name: "头条文旅", file: "最新_今日头条_文旅榜.json", max: 50 }
      - { name: "微博热搜", file: "最新_微博热搜.json", max: 80 }
      - { name: "微博社会", file: "最新_微博社会.json", max: 80 }
      - { name: "头条热榜", file: "最新_今日头条_热榜.json", max: 80 }
      - { name: "抖音热搜", file: "最新_抖音热搜.json", max: 80 }
      - { name: "百度民生", file: "最新_百度热搜_民生榜.json", max: 80 }
      - { name: "头条国际", file: "最新_今日头条_国际榜.json", max: 80 }

  domestic:
    enabled: false         # 通用 RSS（人民网等），如需要可配置 feeds
    feeds: []

scoring:
  weights:
    novelty: 0.25         # 新颖性
    repetition: 0.20      # 重复性
    diffusion: 0.15       # 扩散性
    impact: 0.25          # 影响性
    sustainability: 0.15  # 持续性
  thresholds:
    normal: 3             # ≤3 普通信息（不进入日报）
    observe: 6            # 4-6 观察信息
    focus: 7              # ≥7 重点关注
  max_groups: 20          # 弱信号分组评分数量上限

output:
  data_dir: outputs/data
  report_dir: outputs/reports
  log_dir: outputs/logs
  keep_days: 30           # 原始数据保留天数
  timezone: Asia/Shanghai
