[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tourism-weak-signal"
version = "0.1.0"
description = "出入境旅游弱信号发现与研判 Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2",
    "pydantic>=2.8",
    "feedparser>=6.0",
    "requests>=2.31",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
